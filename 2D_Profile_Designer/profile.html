<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kynetic Metalworks - 2D Profile Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #8b8b8b;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #57626b;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
        }

        .header-text {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1em;
            opacity: 0.8;
        }

        .top-controls {
            background: #f8f9fa;
            padding: 20px 30px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .profile-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .input-field label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .input-field input {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-field input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .side-indicator {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
        }

        .side-toggle {
            position: relative;
            width: 80px;
            height: 32px;
            background: #e9ecef;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .side-toggle input[type="checkbox"] {
            display: none;
        }

        .toggle-slider {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            border-radius: 14px;
            transition: all 0.3s ease;
            transform: translateX(0);
            z-index: 1;
        }

        .side-toggle input:checked + .toggle-slider::before {
            transform: translateX(100%);
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .side-label {
            position: absolute;
            width: 50%;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .side-label.left {
            left: 0;
        }

        .side-label.right {
            right: 0;
        }

        .side-toggle input:not(:checked) + .toggle-slider .side-label.left {
            color: white;
        }

        .side-toggle input:not(:checked) + .toggle-slider .side-label.right {
            color: #666;
        }

        .side-toggle input:checked + .toggle-slider .side-label.left {
            color: #666;
        }

        .side-toggle input:checked + .toggle-slider .side-label.right {
            color: white;
        }

        .mode-controls {
            flex-shrink: 0;
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 0;
        }

        .mode-toggle {
            display: flex;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: #6c757d;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #3498db;
            color: white;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #1f6591);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #229954, #1e8449);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .main-content {
            height: calc(100vh - 300px);
            min-height: 500px;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .canvas-container.edit-mode #canvas {
            cursor: default;
        }

        #canvas {
            cursor: crosshair;
            background: 
                radial-gradient(circle, #e8e8e8 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .measurement-label {
            fill: #3498db;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }

        .angle-label {
            fill: #e67e22;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }

        .edit-mode .measurement-label,
        .edit-mode .angle-label {
            pointer-events: all;
            cursor: pointer;
        }

        .edit-mode .measurement-label:hover {
            fill: #e74c3c;
            font-size: 14px;
        }

        .edit-mode .angle-label:hover {
            fill: #9b59b6;
            font-size: 14px;
        }

        .clickable-bg {
            fill: rgba(255, 255, 255, 0.8);
            stroke: rgba(52, 152, 219, 0.5);
            stroke-width: 1;
            rx: 3;
            ry: 3;
            pointer-events: all;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .edit-mode .clickable-bg {
            opacity: 1;
        }

        .edit-mode .clickable-bg:hover {
            fill: rgba(52, 152, 219, 0.1);
            stroke: rgba(52, 152, 219, 0.8);
            stroke-width: 2;
        }

        .angle-arc {
            stroke: #f39c12;
            stroke-width: 1;
            fill: none;
            stroke-dasharray: 3,3;
            opacity: 0.8;
        }

        .edit-popup {
            position: absolute;
            background: white;
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            min-width: 250px;
            display: none;
        }

        .edit-popup h4 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 16px;
        }

        .edit-popup .input-group {
            margin-bottom: 15px;
        }

        .edit-popup .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 600;
        }

        .edit-popup .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
        }

        .edit-popup .btn {
            width: 48%;
            margin-right: 4%;
        }

        .edit-popup .btn:last-child {
            margin-right: 0;
        }

        .point {
            fill: #3498db;
            stroke: white;
            stroke-width: 2;
            cursor: pointer;
        }

        .point:hover {
            fill: #2980b9;
            stroke-width: 3;
        }

        .point.draggable {
            cursor: grab;
            stroke-width: 3;
            r: 8;
        }

        .point.dragging {
            cursor: grabbing;
            fill: #e74c3c;
            stroke-width: 4;
        }

        .line {
            stroke: #b0b4b9;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .preview-line {
            stroke: #95a5a6;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
        }

        .hem-curve {
            stroke: #ff6b35;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }

        .hem-parallel {
            stroke: #ff6b35;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 3,3;
            opacity: 0.8;
        }

        .coating-hash {
            stroke: #e74c3c;
            stroke-width: 1;
            stroke-linecap: round;
            opacity: 0.8;
        }

        .status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .coords {
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .top-controls {
                flex-direction: column;
                align-items: stretch;
                flex-wrap: wrap;
            }
            
            .profile-info {
                flex-direction: column;
            }
        }

        /* Line Cross Popup */
        #lineCrossPopup {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            padding: 24px;
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        #lineCrossPopup h3 {
            color: #e74c3c;
            margin-bottom: 12px;
        }

        #lineCrossPopup .btn {
            width: 100%;
            margin-top: 12px;
        }

        /* New styles for resizable description box */
        .input-field input#profileDescription {
            min-height: 48px;
            height: 48px;
            font-size: 15px;
            padding: 10px 12px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-text">
                <h1>2D Profile Designer</h1>
                <p>Precision Metal Forming Solutions</p>
            </div>
        </div>
        
        <div class="top-controls">
    <!-- Customer Information Row -->
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;">
        <div class="input-field" style="flex: 1; min-width: 180px;">
            <label for="customerName">Customer Name *</label>
            <input type="text" id="customerName" required>
        </div>
        
        <div class="input-field" style="flex: 1; min-width: 180px;">
            <label for="profileName">Profile Name *</label>
            <input type="text" id="profileName" value="Custom Profile" required>
        </div>
        
        <div class="input-field" style="flex: 2; min-width: 250px;">
            <label for="profileDescription">Description</label>
            <input type="text" id="profileDescription" placeholder="Brief description">
        </div>
    </div>
    
    <!-- Specifications Row -->
    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;">
        <div class="input-field">
            <label for="metalType">Metal Type</label>
            <select id="metalType" onchange="updateGaugeOptions()" style="padding: 8px 12px; border: 2px solid #e9ecef; border-radius: 6px;">
                <option value="steel">Steel</option>
                <option value="aluminum">Aluminum</option>
            </select>
        </div>
        
        <div class="input-field">
            <label for="metalGauge">Gauge</label>
            <select id="metalGauge" style="padding: 8px 12px; border: 2px solid #e9ecef; border-radius: 6px;">
                <option value="22" selected>22</option>
                <option value="24">24</option>
                <option value="26">26</option>
                <option value="28">28</option>
                <option value="30">30</option>
            </select>
        </div>
        
        <div class="input-field">
            <label for="color">Color</label>
            <input type="text" id="color" value="White" style="width: 100px;">
        </div>
        
        <div class="input-field">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" value="1" min="1" style="width: 70px;">
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 20px;">
            <input type="checkbox" id="hasRibs" style="width: 16px; height: 16px;">
            <label for="hasRibs" style="font-weight: 600; color: #2c3e50;">Include Ribs</label>
        </div>
    </div>
    
    <!-- Controls Row -->
    <div class="profile-info">
        <div class="input-field">
            <label>Total Material Usage</label>
            <div style="padding: 8px 12px; background: #e9ecef; border-radius: 6px; font-weight: bold; color: #2d5a5c;">
                <span id="totalLength">0.00"</span>
            </div>
        </div>
    </div>
    
    <div class="mode-controls">
        <div class="side-indicator" style="flex-direction:column; align-items:flex-start;">
            <label class="toggle-label" style="margin-bottom:0;">
                <span>Colored Side:</span>
                <div class="side-toggle">
                    <input type="checkbox" id="sideToggle" onchange="toggleCoatedSide()">
                    <div class="toggle-slider">
                        <span class="side-label left">A</span>
                        <span class="side-label right">B</span>
                    </div>
                </div>
            </label>
            <div id="hashSideInfo" style="margin-top:8px; padding:6px 14px; background:#f3f6fa; border-radius:6px; font-size:14px; color:#3498db; font-weight:500; text-align:center; box-shadow:0 2px 6px rgba(52,152,219,0.07); width:max-content;">
                Hash side = Color side
            </div>
        </div>
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('create')" id="createModeBtn">Create</button>
            <button class="mode-btn" onclick="setMode('edit')" id="editModeBtn">Edit</button>
        </div>

        <button class="btn btn-danger" onclick="clearCanvas()">Clear All</button>
        <button class="btn btn-success" onclick="submitProfileRequest()" style="font-size: 16px; padding: 12px 24px;">Submit Profile Request</button>
    </div>
</div>
        
        <div class="main-content">
            <div class="canvas-container" id="canvasContainer">
                <svg id="canvas" width="100%" height="100%">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#4a7c7e" />
                        </marker>
                    </defs>
                    <g id="grid"></g>
                    <g id="lines"></g>
                    <g id="points"></g>
                    <g id="labels"></g>
                </svg>
                
                <!-- Edit Popup -->
                <div id="editPopup" class="edit-popup">
                    <h4 id="popupTitle">Edit Element</h4>
                    <div class="input-group">
                        <label id="popupLabel">Value:</label>
                        <input type="number" id="popupInput" step="0.125" placeholder="Enter value">
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="applyPopupEdit()">Apply</button>
                        <button class="btn btn-danger" onclick="closeEditPopup()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="status">
            <span id="mode">Click on the canvas to start drawing your profile</span>
            <span class="coords" id="coordinates">Mouse: (0, 0)</span>
        </div>
    </div>

    <script>
async function downloadProfileImage() {
    const container = document.querySelector('.canvas-container');
    
    if (!container) {
        console.error('Canvas container not found');
        return;
    }
    
    try {
        // Load html2canvas if not available
        if (typeof html2canvas === 'undefined') {
            console.log('Loading html2canvas...');
            await loadHtml2Canvas();
        }
        
        console.log('Taking screenshot...');
        const canvas = await html2canvas(container, {
            backgroundColor: 'white',
            scale: 2, // Higher resolution for crisp image
            useCORS: true,
            allowTaint: true,
            logging: false,
            width: container.offsetWidth,
            height: container.offsetHeight,
            scrollX: 0,
            scrollY: 0
        });
        
        // Download the canvas as PNG
        canvas.toBlob((blob) => {
            if (!blob) {
                console.error('Failed to create blob from canvas');
                return;
            }
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = 'profile.png';
            a.href = url;
            a.style.display = 'none';
            
            document.body.appendChild(a);
            a.click();            
            setTimeout(() => URL.revokeObjectURL(url), 100);
        }, 'image/png', 1.0);
        
    } catch (error) {
        console.error('Screenshot failed:', error);
        alert('Screenshot failed: ' + error.message);
    }
}

function loadHtml2Canvas() {
    return new Promise((resolve, reject) => {
        if (typeof html2canvas !== 'undefined') {
            resolve();
            return;
        }
        
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => {
            console.log('html2canvas loaded successfully');
            resolve();
        };
        script.onerror = () => {
            reject(new Error('Failed to load html2canvas library'));
        };
        document.head.appendChild(script);
    });
}
        let isDrawing = true; // Auto-start drawing
        let isEditMode = false;
        let isDragging = false;
        let dragPointIndex = -1;
        let currentEditElement = null;
        let coatedSideRight = false; // false = left/top coated, true = right/bottom coated
        let points = [];
        let entities = []; // DXF entity storage
        let scale = 20; // pixels per inch
        let offset = { x: 50, y: 50 };

        // DXF layers
        const LAYERS = {
            PROFILE: 'PROFILE',
            HEM: 'HEM',
            CONSTRUCTION: 'CONSTRUCTION'
        };

            // Convert entities array to a valid DXF string (R12+)
            function entitiesToDXF(entities) {
                // DXF header
                let dxf = [
                    "0",
                    "SECTION",
                    "2",
                    "HEADER",
                    "0",
                    "ENDSEC",
                    "0",
                    "SECTION",
                    "2",
                    "TABLES",
                    "0",
                    "ENDSEC",
                    "0",
                    "SECTION",
                    "2",
                    "BLOCKS",
                    "0",
                    "ENDSEC",
                    "0",
                    "SECTION",
                    "2",
                    "ENTITIES"
                ];

                // Entities
                for (const ent of entities) {
                    if (ent.type === "POINT") {
                        dxf.push(
                            "0", "POINT",
                            "8", ent.layer || "PROFILE",
                            "10", Number(ent.x).toFixed(6),
                            "20", Number(ent.y).toFixed(6),
                            "30", "0"
                        );
                    } else if (ent.type === "LINE") {
                        dxf.push(
                            "0", "LINE",
                            "8", ent.layer || "PROFILE",
                            "10", Number(ent.x1).toFixed(6),
                            "20", Number(ent.y1).toFixed(6),
                            "30", "0",
                            "11", Number(ent.x2).toFixed(6),
                            "21", Number(ent.y2).toFixed(6),
                            "31", "0"
                        );
                    }
                    // Add more entity types as needed
                }

                // DXF footer
                dxf.push(
                    "0",
                    "ENDSEC",
                    "0",
                    "EOF"
                );

                return dxf.join("\r\n");
            }

        const canvas = document.getElementById('canvas');
        const pointsGroup = document.getElementById('points');
        const linesGroup = document.getElementById('lines');
        const labelsGroup = document.getElementById('labels');

        // DXF Coordinate conversion functions
        function screenToDxf(screenPoint) {
            // Convert from screen coordinates to DXF coordinates
            // Screen: origin top-left, Y increases downward
            // DXF: standard Cartesian, Y increases upward
            const dxfX = (screenPoint.x - offset.x) / scale;
            const dxfY = (canvas.clientHeight - screenPoint.y - offset.y) / scale;
            return { x: dxfX, y: dxfY };
        }

        function dxfToScreen(dxfPoint) {
            // Convert from DXF coordinates to screen coordinates
            const screenX = dxfPoint.x * scale + offset.x;
            const screenY = canvas.clientHeight - (dxfPoint.y * scale + offset.y);
            return { x: screenX, y: screenY };
        }

        function closeEditPopup() {
            const popup = document.getElementById('editPopup');
            popup.style.display = 'none';
            currentEditElement = null;
        }

        function applyPopupEdit() {
            if (!currentEditElement) return;
            
            const input = document.getElementById('popupInput');
            const newValue = parseFloat(input.value);
            
            if (isNaN(newValue)) {
                alert('Please enter a valid number.');
                return;
            }
            
            if (currentEditElement.type === 'length') {
                applyLengthEditByIndex(currentEditElement.index, newValue);
            } else if (currentEditElement.type === 'angle') {
                applyAngleEditByIndex(currentEditElement.index, newValue);
            }
            
            redrawProfile();
            updateStats();
            closeEditPopup();
        }

        // Canvas event listeners
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mouseup', handleMouseUp);

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            // Convert to DXF coordinates for display
            const dxfCoords = screenToDxf({ x: screenX, y: screenY });
            document.getElementById('coordinates').textContent = `Mouse: (${dxfCoords.x.toFixed(2)}", ${dxfCoords.y.toFixed(2)}")`;
            
            // Handle dragging in edit mode
            if (isDragging && dragPointIndex >= 0) {
                // Save old position
                const oldPoint = { ...points[dragPointIndex] };
                points[dragPointIndex] = { ...points[dragPointIndex], x: screenX, y: screenY };

                // If dragging the hem's previous vertex, update the hem endpoint to keep length and angle fixed
                if (typeof window.hemVertexIndex !== 'undefined' && dragPointIndex === window.hemVertexIndex) {
                    // Calculate the new endpoint for the hem line
                    const hemInfo = window.hemInfo;
                    if (hemInfo && points.length > hemInfo.index + 1) {
                        // Get the previous vertex (hem base)
                        const base = points[hemInfo.index];
                        // Get the original direction and length
                        const origEnd = points[hemInfo.index + 1];
                        const dx = origEnd.x - oldPoint.x;
                        const dy = origEnd.y - oldPoint.y;
                        const length = Math.sqrt(dx * dx + dy * dy);
                        // Use the hem length from hemInfo if available
                        const hemLength = hemInfo.length || length;
                        // Calculate the angle
                        const angle = Math.atan2(dy, dx);
                        // Calculate new endpoint
                        const newEnd = {
                            x: base.x + Math.cos(angle) * hemLength * scale,
                            y: base.y + Math.sin(angle) * hemLength * scale
                        };
                        points[hemInfo.index + 1] = newEnd;
                    }
                }

                // Check for line crossing after move
                let crossed = false;
                for (let i = 0; i < points.length - 1; i++) {
                    for (let j = 0; j < points.length - 1; j++) {
                        if (Math.abs(i - j) <= 1) continue; // skip adjacent lines
                        const lineA = { start: points[i], end: points[i + 1] };
                        const lineB = { start: points[j], end: points[j + 1] };
                        if (doLinesIntersect(lineA.start, lineA.end, lineB.start, lineB.end)) {
                            crossed = true;
                            break;
                        }
                    }
                    if (crossed) break;
                }
                if (crossed) {
                    points[dragPointIndex] = oldPoint;
                    showLineCrossPopup();
                    redrawProfile();
                    return;
                }

                redrawProfile();
                return;
            }
            
            // Show preview line when drawing
            if (isDrawing && points.length > 0 && !isEditMode) {
                showPreviewLine(screenX, screenY);
            }
        }

        function handleMouseDown(e) {
            if (!isEditMode) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Check if clicking on a point or hem vertex
            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                if (point.isHem) {
                    // Check if click is inside hem square
                    if (x >= point.x - 8 && x <= point.x + 8 && y >= point.y - 8 && y <= point.y + 8) {
                        isDragging = true;
                        dragPointIndex = i;
                        const allPoints = document.querySelectorAll('.point');
                        allPoints.forEach(pt => {
                            if (parseInt(pt.getAttribute('data-index')) === i) pt.classList.add('dragging');
                        });
                        return;
                    }
                } else {
                    const distance = Math.sqrt((x - point.x) ** 2 + (y - point.y) ** 2);
                    if (distance <= 12) {
                        isDragging = true;
                        dragPointIndex = i;
                        const allPoints = document.querySelectorAll('.point');
                        allPoints.forEach(pt => {
                            if (parseInt(pt.getAttribute('data-index')) === i) pt.classList.add('dragging');
                        });
                        return;
                    }
                }
            }
        }

        function handleMouseUp(e) {
            if (isDragging) {
                isDragging = false;
                
                const allPoints = document.querySelectorAll('.point');
                allPoints.forEach(point => point.classList.remove('dragging'));
                
                dragPointIndex = -1;
                redrawProfile();
            }
        }

        function handleCanvasClick(e) {
            if (isDragging) return;
            if (isEditMode) return;
            if (!isDrawing) return;
            // Only block clicks on interactive elements (points, labels, popups)
            const ignoreTags = ['circle', 'rect', 'text', 'foreignObject'];
            if (ignoreTags.includes(e.target.tagName)) return;
            // Accept clicks anywhere inside the SVG
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            addPoint(x, y);
        }

        function addPoint(x, y) {
            let snapX = x, snapY = y;
            // Snap to vertical/horizontal if close enough (in screen coordinates)
            if (points.length > 0) {
                const last = points[points.length - 1];
                const dx = x - last.x;
                const dy = y - last.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                // Normalize angle to [0, 360)
                let normAngle = angle;
                if (normAngle < 0) normAngle += 360;
                // Snap thresholds (degrees)
                const threshold = 10;
                // Snap to horizontal (0 or 180)
                if ((Math.abs(normAngle) < threshold) || (Math.abs(normAngle - 180) < threshold)) {
                    snapY = last.y;
                }
                // Snap to vertical (90 or 270)
                else if ((Math.abs(normAngle - 90) < threshold) || (Math.abs(normAngle - 270) < threshold)) {
                    snapX = last.x;
                }
            }
            const point = { x: snapX, y: snapY };
            // Prevent line crossing
            if (points.length > 1) {
                const newLine = { start: points[points.length - 1], end: point };
                for (let i = 0; i < points.length - 2; i++) {
                    const lineA = { start: points[i], end: points[i + 1] };
                    if (doLinesIntersect(lineA.start, lineA.end, newLine.start, newLine.end)) {
                        showLineCrossPopup();
                        return;
                    }
                }
            }
            
            // Add point to UI tracking array
            points.push(point);

            // Create DXF POINT entity
            entities.push({
                type: 'POINT',
                x: point.x,
                y: point.y,
                layer: LAYERS.PROFILE
            });

            drawPoint(point, points.length - 1);

            // If we have 2+ points, create a DXF LINE entity
            if (points.length > 1) {
                const prevPoint = points[points.length - 2];
                entities.push({
                    type: 'LINE',
                    start: { x: prevPoint.x, y: prevPoint.y },
                    end: { x: point.x, y: point.y },
                    layer: LAYERS.PROFILE
                });

                // If the first point was a hem, handle it specially when adding the second point
                if (points[0].isHem && points[0].hemData && points.length === 2) {
                    // Save the second point's position temporarily
                    const secondPoint = { ...points[1] };
                    // Apply the hem length which will modify point positions
                    applyLengthEditByIndex(0, points[0].hemData.length);
                    // Restore the second point's position
                    points[1] = secondPoint;
                    // Update window.hemInfo to ensure proper rendering
                    window.hemVertexIndex = 0;
                    window.hemInfo = points[0].hemData;
                    // Draw the hem arc
                    addHemArcAtVertex(0);
                    // Force measurement redraw for first hem
                    drawMeasurements();
                }
            }
            if (points.length > 1) {
                drawLine(points[points.length - 2], point, points.length - 2);
                clearPreviewLine(); // Remove preview line and label immediately
                drawMeasurements(); // Draw permanent label
                // Remove preview angle label immediately
                const angleLabel = document.getElementById('preview-angle-label');
                if (angleLabel) angleLabel.remove();
            }
            updateStats();
            clearPreviewLine();
            
            // Show hem popup for first point or if angle < 30°
            if (points.length === 1) {
                showHemPopup(0, true); // true indicates it's the first point
            } else if (points.length > 2) {
                // The new vertex is at points.length - 2 (the previous point)
                const vertexIndex = points.length - 2;
                const angle = calculateVertexAngle(vertexIndex);
                if (angle < 30) {
                    showHemPopup(vertexIndex, false);
                }
            }
        }

        // Helper function to check if two line segments intersect
        function doLinesIntersect(p1, p2, p3, p4) {
            function ccw(a, b, c) {
                return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x);
            }
            return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
        }

        // Draw info box below hem vertex with the entered details
        function showHemInfoBox(hemInfo) {
            if (!hemInfo) return;

            const vertex = points[hemInfo.index];
            if (!vertex) return;
            // Remove only this hem's info box if it exists
            const oldBox = document.getElementById(`hem-info-box-${hemInfo.index}`);
            if (oldBox) oldBox.remove();
            
            // Info text stacked vertically
            const padding = 10; // Minimum distance from canvas edges
            const lines = ['HEM', `Length: ${hemInfo.length} in`, `Type: ${hemInfo.type}`, `Side: ${hemInfo.side === 'colored' ? 'Colored' : 'Non-Colored'}`];
            if (hemInfo.type === 'open' && hemInfo.openAmount) {
                lines.push(`Open: ${hemInfo.openAmount} in`);
            }
            const fontSize = 13;
            const lineHeight = fontSize + 5;
            const boxHeight = lines.length * lineHeight + padding;
            const maxLineLength = Math.max(...lines.map(l => l.length));
            const boxWidth = maxLineLength * 8 + padding;
            
            // Helper function to check if box intersects with any line
            function doesBoxIntersectLines(boxX, boxY) {
                // Box corners
                const boxCorners = [
                    {x: boxX, y: boxY},
                    {x: boxX + boxWidth, y: boxY},
                    {x: boxX + boxWidth, y: boxY + boxHeight},
                    {x: boxX, y: boxY + boxHeight}
                ];
                
                // Box edges
                const boxEdges = [
                    {start: boxCorners[0], end: boxCorners[1]},
                    {start: boxCorners[1], end: boxCorners[2]},
                    {start: boxCorners[2], end: boxCorners[3]},
                    {start: boxCorners[3], end: boxCorners[0]}
                ];
                
                // Check intersection with each line segment in the profile
                for (let i = 0; i < points.length - 1; i++) {
                    const line = {
                        start: points[i],
                        end: points[i + 1]
                    };
                    
                    // Check if any box edge intersects with the line
                    for (const boxEdge of boxEdges) {
                        if (doLinesIntersect(boxEdge.start, boxEdge.end, line.start, line.end)) {
                            return true;
                        }
                    }
                }
                return false;
            }

            // Get canvas bounds
            const canvasBounds = canvas.getBoundingClientRect();

            // Calculate valid ranges for box position
            const minX = padding;
            const maxX = canvasBounds.width - boxWidth - padding;
            const minY = padding;
            const maxY = canvasBounds.height - boxHeight - padding;

            // Try positions in different directions around the vertex
            const directions = [
                { angle: 0, dist: 60 },    // right
                { angle: 90, dist: 60 },   // below
                { angle: 180, dist: 60 },  // left
                { angle: 270, dist: 60 },  // above
                { angle: 45, dist: 85 },   // bottom-right
                { angle: 135, dist: 85 },  // bottom-left
                { angle: 225, dist: 85 },  // top-left
                { angle: 315, dist: 85 }   // top-right
            ];

            // Function to get box position from angle and distance
            function getBoxPosition(vertex, angle, distance) {
                const radians = angle * Math.PI / 180;
                return {
                    x: vertex.x + Math.cos(radians) * distance,
                    y: vertex.y + Math.sin(radians) * distance
                };
            }

            // Find first non-intersecting position
            let bestPos = null;
            let minIntersections = Infinity;
            
            // Try each direction with varying distances
            const distanceMultipliers = [1, 1.5, 2, 0.75];
            
            for (const dir of directions) {
                for (const mult of distanceMultipliers) {
                    const pos = getBoxPosition(vertex, dir.angle, dir.dist * mult);
                    
                    // Ensure box stays within canvas bounds
                    if (pos.x < minX || pos.x + boxWidth > maxX || 
                        pos.y < minY || pos.y + boxHeight > maxY) {
                        continue;
                    }
                    
                    // Check for line intersections
                    if (!doesBoxIntersectLines(pos.x, pos.y)) {
                        bestPos = pos;
                        break;
                    }
                }
                if (bestPos) break;
            }
            
            // If no clear position found, use default position
            if (!bestPos) {
                bestPos = {
                    x: Math.min(Math.max(vertex.x + 60, minX), maxX),
                    y: Math.min(Math.max(vertex.y + 60, minY), maxY)
                };
            }
            // Create the info box group
            const boxGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            boxGroup.setAttribute('id', `hem-info-box-${hemInfo.index}`);
            boxGroup.setAttribute('data-hem-index', hemInfo.index);
            
            // Background box
            const box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            box.setAttribute('x', bestPos.x);
            box.setAttribute('y', bestPos.y);
            box.setAttribute('width', boxWidth);
            box.setAttribute('height', boxHeight);
            box.setAttribute('fill', '#fffbe6');
            box.setAttribute('stroke', '#ff6b35');
            box.setAttribute('stroke-width', '2');
            box.setAttribute('rx', '5');
            boxGroup.appendChild(box);

            // Add text lines
            lines.forEach((line, index) => {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', bestPos.x + padding/2);
                text.setAttribute('y', bestPos.y + (index + 1) * lineHeight);
                text.setAttribute('fill', index === 0 ? '#ff6b35' : '#2c3e50');
                text.setAttribute('font-size', fontSize);
                text.setAttribute('font-weight', index === 0 ? 'bold' : 'normal');
                text.textContent = line;
                boxGroup.appendChild(text);
            });
            
            // Add edit button if not the first vertex or if we have 2+ points
            if ((hemInfo.index > 0 || points.length > 1) && isEditMode) {
                const editBtn = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                editBtn.setAttribute('x', bestPos.x + boxWidth + 5);
                editBtn.setAttribute('y', bestPos.y + 15);
                editBtn.setAttribute('font-size', '15');
                editBtn.setAttribute('fill', '#3498db');
                editBtn.setAttribute('cursor', 'pointer');
                editBtn.setAttribute('text-anchor', 'start');
                editBtn.textContent = '\u270E'; // Pencil icon
                editBtn.setAttribute('id', `hem-edit-btn-${hemInfo.index}`);
                editBtn.setAttribute('data-hem-index', hemInfo.index);
                
                editBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const hemIndex = parseInt(this.getAttribute('data-hem-index'), 10);
                    
                    // Always remove existing modal to ensure we start fresh
                    const existingModal = document.getElementById('hemDetailsModal');
                    if (existingModal) {
                        existingModal.remove();
                    }
                    
                    // Show new modal with correct hem index
                    const isFirstPoint = hemIndex === 0 && points.length === 1;
                    showSimpleHemDetailsModal(hemIndex, isFirstPoint);
                });
                boxGroup.appendChild(editBtn);
            }

            // Add the info box group to the SVG
            linesGroup.appendChild(boxGroup);
        }

        // Make the hem vertex the end point of the profile
        function addHemArcAtVertex(vertexIndex) {
            // Check if this is a first point hem
            const isFirstPoint = vertexIndex === 0 && points.length <= 2;
            // Only proceed if it's the first point or if we have a previous point
            if (!isFirstPoint && vertexIndex <= 0) return;
            
            const hem = points[vertexIndex];
            const prev = vertexIndex > 0 ? points[vertexIndex - 1] : null;
            
            // For points after first hem, remove subsequent points
            if (!isFirstPoint) {
                while (points.length > vertexIndex + 1) {
                    const pointToRemove = points.length - 1;
                    const pointElement = document.querySelector(`[data-point-index="${pointToRemove}"]`);
                    if (pointElement) {
                        pointElement.remove();
                    }
                    
                    // Remove the line connecting to this point
                    const lineElement = document.querySelector(`[data-index="${pointToRemove - 1}"]`);
                    if (lineElement) {
                        lineElement.remove();
                    }
                    
                    points.pop();
                }
            }
            
            // Draw square hem marker
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', hem.x - 8);
            rect.setAttribute('y', hem.y - 8);
            rect.setAttribute('width', 16);
            rect.setAttribute('height', 16);
            rect.setAttribute('fill', '#ff6b35');
            rect.setAttribute('stroke', '#fffbe6');
            rect.setAttribute('stroke-width', '3');
            rect.setAttribute('class', 'hem-point');
            rect.setAttribute('data-index', vertexIndex);
            pointsGroup.appendChild(rect);
        }

        function closeHemPopup() {
            const hemPopup = document.getElementById('hemPopup');
            if (hemPopup) hemPopup.style.display = 'none';
        }

        function applyHemPopup(pointIndex) {
            closeHemPopup();
            redrawProfile();
        }

        function drawPoint(point, index) {
            // Check if the previous point has a hem
            if (index > 0 && points[index - 1].hemData) {
                // Don't draw this vertex (the one after a hem)
                return;
            }

            if (point.isHem) {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', point.x - 8);
                rect.setAttribute('y', point.y - 8);
                rect.setAttribute('width', 16);
                rect.setAttribute('height', 16);
                rect.setAttribute('class', isEditMode ? 'draggable' : ''); // Remove point class for hems
                rect.setAttribute('fill', '#ff6b35'); // Always orange for hems
                rect.setAttribute('stroke', '#fffbe6');
                rect.setAttribute('stroke-width', '3');
                rect.setAttribute('data-index', index);
                rect.setAttribute('data-type', 'hem');
                pointsGroup.appendChild(rect);
                return;
            }
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', point.x);
            circle.setAttribute('cy', point.y);
            circle.setAttribute('r', isEditMode ? 8 : 6);
            circle.setAttribute('class', isEditMode ? 'point draggable' : 'point');
            circle.setAttribute('data-index', index);
            pointsGroup.appendChild(circle);
        }

        function drawLine(start, end, index) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', start.x);
            line.setAttribute('y1', start.y);
            line.setAttribute('x2', end.x);
            line.setAttribute('y2', end.y);
            line.setAttribute('class', 'line');
            line.setAttribute('data-index', index);
            linesGroup.appendChild(line);
            
            // Add coating hash marks
            drawCoatingHashes(start, end);
        }

        function drawCoatingHashes(start, end) {
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            
            if (length < 20) return;
            
            const dirX = dx / length;
            const dirY = dy / length;
            
            const perpX = -dirY;
            const perpY = dirX;
            
            const hashOffset = coatedSideRight ? 8 : -8;
            const offsetX = perpX * hashOffset;
            const offsetY = perpY * hashOffset;
            
            const hashSpacing = 15;
            const hashLength = 6;
            const numHashes = Math.floor(length / hashSpacing);
            
            for (let i = 1; i < numHashes; i++) {
                const t = i / numHashes;
                const lineX = start.x + dx * t;
                const lineY = start.y + dy * t;
                
                const hash1X = lineX + offsetX - perpX * hashLength/2;
                const hash1Y = lineY + offsetY - perpY * hashLength/2;
                const hash2X = lineX + offsetX + perpX * hashLength/2;
                const hash2Y = lineY + offsetY + perpY * hashLength/2;
                
                const hash = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                hash.setAttribute('x1', hash1X);
                hash.setAttribute('y1', hash1Y);
                hash.setAttribute('x2', hash2X);
                hash.setAttribute('y2', hash2Y);
                hash.setAttribute('class', 'coating-hash');
                linesGroup.appendChild(hash);
            }
        }

        function showPreviewLine(mouseX, mouseY) {
            clearPreviewLine();
            if (points.length === 0) return;
            const lastPoint = points[points.length - 1];
            // Draw preview (phantom) line
            let previewLine = document.getElementById('preview');
            if (!previewLine) {
                previewLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                previewLine.setAttribute('id', 'preview');
                previewLine.setAttribute('class', 'preview-line');
                linesGroup.appendChild(previewLine);
            }
            previewLine.setAttribute('x1', lastPoint.x);
            previewLine.setAttribute('y1', lastPoint.y);
            previewLine.setAttribute('x2', mouseX);
            previewLine.setAttribute('y2', mouseY);

            // Calculate preview length using DXF coordinates
            const lastDxf = screenToDxf(lastPoint);
            const mouseDxf = screenToDxf({ x: mouseX, y: mouseY });
            const deltaX = mouseDxf.x - lastDxf.x;
            const deltaY = mouseDxf.y - lastDxf.y;
            const length = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            // Move label off the line, above it in white space
            const midX = (lastPoint.x + mouseX) / 2;
            const midY = (lastPoint.y + mouseY) / 2 - 24;

            // Add or update preview length label
            let lengthLabel = document.getElementById('preview-length-label');
            if (!lengthLabel) {
                lengthLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                lengthLabel.setAttribute('id', 'preview-length-label');
                lengthLabel.setAttribute('class', 'measurement-label');
                lengthLabel.setAttribute('text-anchor', 'middle');
                lengthLabel.setAttribute('dominant-baseline', 'central');
                linesGroup.appendChild(lengthLabel);
            }
            lengthLabel.setAttribute('x', midX);
            lengthLabel.setAttribute('y', midY);
            lengthLabel.textContent = `${length.toFixed(3)}"`;

            // Calculate preview angle
            if (points.length > 1) {
                const prev = points[points.length - 2];
                const last = points[points.length - 1];
                const mousePt = { x: mouseX, y: mouseY };
                const vec1 = { x: prev.x - last.x, y: prev.y - last.y };
                const vec2 = { x: mousePt.x - last.x, y: mousePt.y - last.y };
                const dot = vec1.x * vec2.x + vec1.y * vec2.y;
                const mag1 = Math.sqrt(vec1.x * vec1.x + vec1.y * vec1.y);
                const mag2 = Math.sqrt(vec2.x * vec2.x + vec2.y * vec2.y);
                let angle = 0;
                if (mag1 > 0 && mag2 > 0) {
                    angle = Math.acos(dot / (mag1 * mag2)) * 180 / Math.PI;
                }
                // Place angle label at the previous vertex, above it
                let angleLabel = document.getElementById('preview-angle-label');
                if (!angleLabel) {
                    angleLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    angleLabel.setAttribute('id', 'preview-angle-label');
                    angleLabel.setAttribute('class', 'angle-label');
                    angleLabel.setAttribute('text-anchor', 'middle');
                    angleLabel.setAttribute('dominant-baseline', 'central');
                    linesGroup.appendChild(angleLabel);
                }
                angleLabel.setAttribute('x', last.x);
                angleLabel.setAttribute('y', last.y - 44);
                angleLabel.textContent = `${angle.toFixed(1)}°`;
            } else {
                // Remove angle label if not needed
                const angleLabel = document.getElementById('preview-angle-label');
                if (angleLabel) angleLabel.remove();
            }
        }

        function clearPreviewLine() {
            const preview = document.getElementById('preview');
            if (preview) {
                preview.remove();
            }
        }

        function drawMeasurements() {
            labelsGroup.innerHTML = '';
            const lineCount = points.length - 1;
            for (let i = 0; i < lineCount; i++) {
                // Get current and next points
                const current = points[i];
                const next = points[i + 1];
                
                // Special handling for hems
                const isRegularHem = typeof window.hemVertexIndex !== 'undefined' && 
                                   i === points.length - 2 && 
                                   window.hemVertexIndex === points.length - 2;
                                   
                const isFirstPointHem = points[0].isHem && i === 0;
                
                // Skip measurement for regular hems but not for first point hems with exactly 2 points
                if (isRegularHem && !isFirstPointHem) {
                    continue;
                }
                
                // Calculate length using DXF coordinates
                const currentDxf = screenToDxf(current);
                const nextDxf = screenToDxf(next);
                const deltaX = nextDxf.x - currentDxf.x;
                const deltaY = nextDxf.y - currentDxf.y;
                const length = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                // Move permanent label off the line, above it in white space
                const midX = (current.x + next.x) / 2;
                const midY = (current.y + next.y) / 2 - 24;
                createClickableLabel(midX, midY, `${length.toFixed(3)}"`, 'measurement-label', 'length', i);
            }
            
            // Draw angle measurements for interior vertices
            for (let i = 1; i < points.length - 1; i++) {
                const current = points[i];
                const prev = points[i - 1];
                const next = points[i + 1];
                let labelText;
                // Only show 'HEM' if hemVertexIndex is set and matches this vertex
                if (typeof window.hemVertexIndex !== 'undefined' && i === window.hemVertexIndex) {
                    labelText = 'HEM';
                } else {
                    const angle = calculateVertexAngle(i);
                    labelText = `${angle.toFixed(1)}°`;
                }
                createClickableLabel(current.x + 25, current.y - 25, labelText, 'angle-label', 'angle', i - 1);
                // Draw arc for angle (optional, keep as before)
                if (labelText !== 'HEM') {
                    const angle = calculateVertexAngle(i);
                    drawAngleArc(prev, current, next, angle);
                }
            }
        }

        function createClickableLabel(x, y, text, className, type, index) {
            // Create background rectangle for better clicking
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const textWidth = text.length * 8;
            bg.setAttribute('x', x - textWidth/2 - 4);
            bg.setAttribute('y', y - 8);
            bg.setAttribute('width', textWidth + 8);
            bg.setAttribute('height', 16);
            bg.setAttribute('class', 'clickable-bg');
            bg.setAttribute('data-type', type);
            bg.setAttribute('data-index', index);
            
            // Create text element
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', x);
            label.setAttribute('y', y);
            label.setAttribute('class', className);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('dominant-baseline', 'central');
            label.setAttribute('data-type', type);
            label.setAttribute('data-index', index);
            label.textContent = text;
            
            // Prevent editing if label is 'HEM' and type is 'angle'
            if (!(type === 'angle' && text === 'HEM')) {
                const clickHandler = function(e) {
                    if (!isEditMode) return;
                    e.stopPropagation();
                    e.preventDefault();
                    showEditPopup(e, type, index, text);
                };
                bg.addEventListener('click', clickHandler);
                label.addEventListener('click', clickHandler);
            } else {
                // Make non-editable visually
                bg.style.cursor = 'default';
                label.style.cursor = 'default';
                bg.style.pointerEvents = 'none';
                label.style.pointerEvents = 'none';
            }
            labelsGroup.appendChild(bg);
            labelsGroup.appendChild(label);
        }

        function showEditPopup(event, type, index, currentValue) {
            const popup = document.getElementById('editPopup');
            const title = document.getElementById('popupTitle');
            const label = document.getElementById('popupLabel');
            const input = document.getElementById('popupInput');
            
            currentEditElement = { type: type, index: index };
            
            if (type === 'length') {
                title.textContent = `Edit Line ${index + 1} Length`;
                label.textContent = 'Length (inches):';
                input.value = parseFloat(currentValue.replace('"', '')).toFixed(3);
            } else {
                title.textContent = `Edit Vertex ${index + 1} Angle`;
                label.textContent = 'Angle (degrees):';
                input.value = parseFloat(currentValue.replace('°', '')).toFixed(1);
            }
            
            // Get the position of the clicked element
            const targetElement = event.target;
            const canvasRect = canvas.getBoundingClientRect();
            
            let elementX, elementY;
            
            if (targetElement.tagName === 'text') {
                elementX = parseFloat(targetElement.getAttribute('x'));
                elementY = parseFloat(targetElement.getAttribute('y'));
            } else if (targetElement.tagName === 'rect') {
                const rectX = parseFloat(targetElement.getAttribute('x'));
                const rectY = parseFloat(targetElement.getAttribute('y'));
                const rectWidth = parseFloat(targetElement.getAttribute('width'));
                const rectHeight = parseFloat(targetElement.getAttribute('height'));
                elementX = rectX + rectWidth / 2;
                elementY = rectY + rectHeight / 2;
            }
            
            const pageX = canvasRect.left + elementX;
            const pageY = canvasRect.top + elementY;
            
            popup.style.left = (pageX + 30) + 'px';
            popup.style.top = (pageY - 25) + 'px';
            
            popup.style.display = 'block';
            const popupRect = popup.getBoundingClientRect();
            
            if (popupRect.right > window.innerWidth) {
                popup.style.left = (pageX - popupRect.width - 30) + 'px';
            }
            
            if (popupRect.bottom > window.innerHeight) {
                popup.style.top = (pageY - popupRect.height - 10) + 'px';
            }
            
            if (popupRect.top < 0) {
                popup.style.top = (pageY + 30) + 'px';
            }
            
            setTimeout(() => {
                input.focus();
                input.select();
            }, 100);
        }

        function drawAngleArc(prevPoint, centerPoint, nextPoint, angle) {
            const vec1 = { x: prevPoint.x - centerPoint.x, y: prevPoint.y - centerPoint.y };
            const vec2 = { x: nextPoint.x - centerPoint.x, y: nextPoint.y - centerPoint.y };
            
            const angle1 = Math.atan2(vec1.y, vec1.x);
            const angle2 = Math.atan2(vec2.y, vec2.x);
            
            let startAngle = angle1;
            let endAngle = angle2;
            
            let angleDiff = endAngle - startAngle;
            if (angleDiff > Math.PI) {
                angleDiff -= 2 * Math.PI;
            } else if (angleDiff < -Math.PI) {
                angleDiff += 2 * Math.PI;
            }
            
            if (Math.abs(angleDiff) > Math.PI) {
                [startAngle, endAngle] = [endAngle, startAngle];
                angleDiff = endAngle - startAngle;
                if (angleDiff > Math.PI) {
                    angleDiff -= 2 * Math.PI;
                } else if (angleDiff < -Math.PI) {
                    angleDiff += 2 * Math.PI;
                }
            }
            
            const radius = 20;
            
            const startX = centerPoint.x + radius * Math.cos(startAngle);
            const startY = centerPoint.y + radius * Math.sin(startAngle);
            const endX = centerPoint.x + radius * Math.cos(endAngle);
            const endY = centerPoint.y + radius * Math.sin(endAngle);
            
            const largeArcFlag = Math.abs(angleDiff) > Math.PI ? 1 : 0;
            const sweepFlag = angleDiff > 0 ? 1 : 0;
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const pathData = `M ${startX} ${startY} A ${radius} ${radius} 0 ${largeArcFlag} ${sweepFlag} ${endX} ${endY}`;
            path.setAttribute('d', pathData);
            path.setAttribute('class', 'angle-arc');
            
            labelsGroup.appendChild(path);
        }

        function calculateVertexAngle(vertexIndex) {
            const current = points[vertexIndex];
            const prev = points[vertexIndex - 1];
            const next = points[vertexIndex + 1];
            
            const vec1 = { x: prev.x - current.x, y: prev.y - current.y };
            const vec2 = { x: next.x - current.x, y: next.y - current.y };
            
            const dot = vec1.x * vec2.x + vec1.y * vec2.y;
            const mag1 = Math.sqrt(vec1.x * vec1.x + vec1.y * vec1.y);
            const mag2 = Math.sqrt(vec2.x * vec2.x + vec2.y * vec2.y);
            
            let angle = Math.acos(dot / (mag1 * mag2)) * 180 / Math.PI;
            return angle;
        }

        function toggleCoatedSide() {
            coatedSideRight = document.getElementById('sideToggle').checked;
            redrawProfile();
            
            const sideText = coatedSideRight ? 'Side B Colored' : 'Side A Colored';

        function setMode(mode) {

            const editBtn = document.getElementById('editModeBtn');
            const canvasContainer = document.getElementById('canvasContainer');
            
            if (mode === 'create') {
                isEditMode = false;

                isDragging = false;

            } else if (mode === 'edit') {

                isDrawing = false;

        function finishProfile() {
            if (points.length < 2) {
                alert('Need at least 2 points to finish the profile.');
                return;
            }
            
            isDrawing = false;
            document.getElementById('mode').textContent = 'Profile finished. Use Edit mode to make changes.';
            // Clear hem vertex index when finishing profile
            window.hemVertexIndex = undefined;
            drawMeasurements();
            updateStats();
            clearPreviewLine();
        }

        function redrawProfile() {
            pointsGroup.innerHTML = '';
            linesGroup.innerHTML = '';
            
            points.forEach((point, index) => {
                drawPoint(point, index);
            });
            
            for (let i = 0; i < points.length - 1; i++) {
                drawLine(points[i], points[i + 1], i);
            }
            
            // Draw hem arcs and info boxes for all hems
            points.forEach((point, index) => {
                if (point.isHem && point.hemData) {
                    addHemArcAtVertex(index);
                    showHemInfoBox(point.hemData);
                }
            });
            
            drawMeasurements();
            updateStats(); // Ensure material usage updates after any change
        }

        function clearCanvas() {
            points = [];
            dxfEntities = []; // Clear DXF entities as well
            pointsGroup.innerHTML = '';
            linesGroup.innerHTML = '';
            labelsGroup.innerHTML = '';
            isDrawing = true;
            isEditMode = false;
            isDragging = false;
            dragPointIndex = -1;

        function updateStats() {
            let totalLength = 0;
            for (let i = 0; i < points.length - 1; i++) {
                const current = points[i];
                const next = points[i + 1];
                
                // Calculate length using DXF coordinates
                const currentDxf = screenToDxf(current);
                const nextDxf = screenToDxf(next);
                const deltaX = nextDxf.x - currentDxf.x;
                const deltaY = nextDxf.y - currentDxf.y;
                totalLength += Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            }
            
            document.getElementById('totalLength').textContent = `${totalLength.toFixed(3)}"`;
        }

        function applyLengthEditByIndex(lineIndex, newLength) {
            const startPoint = points[lineIndex];
            const endPoint = points[lineIndex + 1];
            
            // Convert to DXF coordinates for calculation
            const startDxf = screenToDxf(startPoint);
            const endDxf = screenToDxf(endPoint);
            
            const deltaX = endDxf.x - startDxf.x;
            const deltaY = endDxf.y - startDxf.y;
            const currentLength = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            if (currentLength === 0) return;
            
            const ratio = newLength / currentLength;
            const newEndDxf = {
                x: startDxf.x + deltaX * ratio,
                y: startDxf.y + deltaY * ratio
            };
            
            // Convert back to screen coordinates
            const newEndPoint = dxfToScreen(newEndDxf);
            
            // Temporarily update the point and check for line crossing
            const oldEndPoint = { ...points[lineIndex + 1] };
            points[lineIndex + 1] = { ...endPoint, x: newEndPoint.x, y: newEndPoint.y };
            
            // Check for line crossing
            for (let i = 0; i < points.length - 2; i++) {
                if (i === lineIndex - 1 || i === lineIndex || i === lineIndex + 1) continue; // skip adjacent lines
                const lineA = { start: points[i], end: points[i + 1] };
                const newLine = { start: points[lineIndex], end: points[lineIndex + 1] };
                if (doLinesIntersect(lineA.start, lineA.end, newLine.start, newLine.end)) {
                    points[lineIndex + 1] = oldEndPoint;
                    showLineCrossPopup();
                    return;
                }
            }
        }

        function applyAngleEditByIndex(vertexIndex, newAngle) {
            const actualVertexIndex = vertexIndex + 1;
            const maxVertices = Math.max(0, points.length - 2);
            if (maxVertices === 0 || actualVertexIndex >= points.length - 1) return;

            const currentPoint = points[actualVertexIndex];
            const prevPoint = points[actualVertexIndex - 1];
            const nextPoint = points[actualVertexIndex + 1];

            const deltaX = nextPoint.x - currentPoint.x;
            const deltaY = nextPoint.y - currentPoint.y;
            const lineLength = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            const prevAngle = Math.atan2(prevPoint.y - currentPoint.y, prevPoint.x - currentPoint.x);
            // Set the angle directly to newAngle (relative to previous segment)
            const newAngleRad = prevAngle + (newAngle * Math.PI / 180);

            // Calculate new coordinates for the next point
            const newX = currentPoint.x + Math.cos(newAngleRad) * lineLength;
            const newY = currentPoint.y + Math.sin(newAngleRad) * lineLength;
            
            // Temporarily update the point and check for line crossing
            const oldNextPoint = { ...points[actualVertexIndex + 1] };
            points[actualVertexIndex + 1] = { ...points[actualVertexIndex + 1], x: newX, y: newY };
            
            // Check for line crossing
            for (let i = 0; i < points.length - 2; i++) {
                if (i === actualVertexIndex - 1 || i === actualVertexIndex || i === actualVertexIndex + 1) continue; // skip adjacent lines
                const lineA = { start: points[i], end: points[i + 1] };
                const newLine = { start: points[actualVertexIndex], end: points[actualVertexIndex + 1] };
                if (doLinesIntersect(lineA.start, lineA.end, newLine.start, newLine.end)) {
                    points[actualVertexIndex + 1] = oldNextPoint;
                    showLineCrossPopup();
                    return;
                }
            }
        }

        // Update gauge options based on metal type
function updateGaugeOptions() {
    const metalType = document.getElementById('metalType').value;
    const gaugeSelect = document.getElementById('metalGauge');
    
    gaugeSelect.innerHTML = '';
    
    if (metalType === 'steel') {
        const steelGauges = ['22', '24', '26', '28', '30'];
        steelGauges.forEach(gauge => {
            const option = document.createElement('option');
            option.value = gauge;
            option.textContent = gauge;
            if (gauge === '22') option.selected = true;
            gaugeSelect.appendChild(option);
        });
    } else if (metalType === 'aluminum') {
        const aluminumGauges = ['.019', '.027', '.032', '.040', '.050'];
        aluminumGauges.forEach(gauge => {
            const option = document.createElement('option');
            option.value = gauge;
            option.textContent = gauge;
            if (gauge === '.032') option.selected = true;
            gaugeSelect.appendChild(option);
        });
    }
}

// Submit profile request function
function submitProfileRequest() {
    // Validate required fields
    const customerName = document.getElementById('customerName').value.trim();
    const profileName = document.getElementById('profileName').value.trim();
    
    if (!customerName || !profileName) {
        alert('Please fill in Customer Name and Profile Name');
        return;
    }
    
    if (points.length < 2) {
        alert('Please create a profile with at least 2 points before submitting');
        return;
    }
    
    // Show loading state
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = 'Submitting...';
    btn.disabled = true;
    
    try {
        // Create task data
        const taskData = createTaskData();
        
        // Show success message
        showSuccessMessage();
        
        // Reset form after delay
        setTimeout(() => {
            clearCanvas();
            resetForm();
        }, 2000);
        
    } catch (error) {
        alert('Error submitting request. Please try again or contact us directly.');
    } finally {
        // Reset button
        setTimeout(() => {
            btn.textContent = originalText;
            btn.disabled = false;
        }, 2000);
    }
}

function createTaskData() {
    // Calculate total length
    let totalLength = 0;
    for (let i = 0; i < points.length - 1; i++) {
        const current = points[i];
        const next = points[i + 1];
        const currentDxf = screenToDxf(current);
        const nextDxf = screenToDxf(next);
        const deltaX = nextDxf.x - currentDxf.x;
        const deltaY = nextDxf.y - nextDxf.y;
        totalLength += Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    }
    
    // Collect hem information
    const hemData = points.filter(p => p.isHem && p.hemData).map(p => p.hemData);
    
    // Create comprehensive task description
    const taskDescription = `NEW PROFILE MANUFACTURING REQUEST

CUSTOMER INFORMATION:
- Customer Name: ${document.getElementById('customerName').value.trim()}
- Profile Name: ${document.getElementById('profileName').value.trim()}
- Description: ${document.getElementById('profileDescription').value.trim() || 'No description provided'}

SPECIFICATIONS:
- Metal Type: ${document.getElementById('metalType').value}
- Gauge: ${document.getElementById('metalGauge').value}
- Color: ${document.getElementById('color').value.trim()}
- Quantity: ${document.getElementById('quantity').value}
- Ribs: ${document.getElementById('hasRibs').checked ? 'Yes' : 'No'}
- Total Length: ${totalLength.toFixed(3)}"
- Coated Side: ${coatedSideRight ? 'Side B (Right)' : 'Side A (Left)'}
- Number of Points: ${points.length}

PROFILE COORDINATES (DXF FORMAT):
${points.map((point, index) => {
    const dxfPoint = screenToDxf(point);
    return `Point ${index + 1}: X=${dxfPoint.x.toFixed(4)}, Y=${dxfPoint.y.toFixed(4)}`;
}).join('\n')}

HEM INFORMATION:
${hemData.length > 0 ? JSON.stringify(hemData, null, 2) : 'No hems specified'}

DXF DATA:
${generateDXFData()}

NEXT STEPS FOR EMPLOYEE:
1. Review profile specifications above
2. Create Manufacturing Order with product "Custom Profile - ${document.getElementById('profileName').value.trim()}"
3. Set quantity to ${document.getElementById('quantity').value}
4. Use DXF data above for manufacturing file
5. Contact customer if clarification needed

Request submitted: ${new Date().toLocaleString()}`;

    return {
        title: `Profile Request: ${document.getElementById('profileName').value.trim()} - ${document.getElementById('customerName').value.trim()}`,
        description: taskDescription
    };
}

function generateDXFData() {
    const dxf = [];
    dxf.push(
        '0', 'SECTION',
        '2', 'HEADER',
        '9', '$ACADVER',
        '1', 'AC1027',
        '0', 'ENDSEC'
    );
    
    dxf.push('0', 'SECTION', '2', 'ENTITIES');
    
    for (let i = 0; i < points.length - 1; i++) {
        const start = screenToDxf(points[i]);
        const end = screenToDxf(points[i + 1]);
        
        dxf.push(
            '0', 'LINE',
            '8', '0',
            '10', start.x.toFixed(4),
            '20', start.y.toFixed(4),
            '30', '0.0',
            '11', end.x.toFixed(4),
            '21', end.y.toFixed(4),
            '31', '0.0'
        );
    }
    
    dxf.push('0', 'ENDSEC', '0', 'EOF');
    return dxf.join('\r\n');
}

        align-items: center;

        text-align: center;
        max-width: 500px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
